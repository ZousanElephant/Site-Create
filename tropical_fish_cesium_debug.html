<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熱帯魚 3D EARTH ATLAS</title>

<link href="https://cesium.com/downloads/cesiumjs/releases/1.139/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.139/Build/Cesium/Cesium.js"></script>

<style>
*{box-sizing:border-box}
html,body,#cesiumContainer{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#000;font-family:"Segoe UI","Noto Sans JP",sans-serif;color:#fff}

#hud{
 position:fixed;z-index:20;left:24px;top:22px;
 padding:14px 18px;border:1px solid rgba(255,255,255,.18);
 border-radius:12px;background:rgba(5,10,18,.62);backdrop-filter:blur(10px);
 box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none
}
#hud .title{font-size:20px;font-weight:700;letter-spacing:.08em}
#hud .sub{font-size:12px;color:#b9c9d8;margin-top:5px}

#fishList{
 position:fixed;z-index:20;right:22px;top:22px;width:250px;
 padding:12px;border:1px solid rgba(255,255,255,.16);border-radius:14px;
 background:rgba(5,10,18,.66);backdrop-filter:blur(12px);
 box-shadow:0 8px 35px rgba(0,0,0,.4)
}
#fishList h3{margin:4px 8px 10px;font-size:13px;color:#b9c9d8;font-weight:500}
.fishBtn{
 width:100%;padding:12px 14px;margin:5px 0;border:1px solid rgba(255,255,255,.12);
 border-radius:9px;background:rgba(255,255,255,.07);color:#fff;text-align:left;
 cursor:pointer;font-size:14px;transition:.2s
}
.fishBtn:hover{background:rgba(255,255,255,.15);transform:translateX(-2px)}

.pin{
 width:30px;height:30px;border-radius:50%;
 border:2px solid #fff;background:#16c8ff;
 box-shadow:0 0 8px #16c8ff,0 0 22px #16c8ff,0 0 45px rgba(22,200,255,.7);
 position:relative;cursor:pointer
}
.pin:after{
 content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;
 transform:translate(-50%,-50%);border-radius:50%;background:#fff
}
.pinLabel{
 margin-top:8px;white-space:nowrap;font-size:12px;font-weight:700;
 text-shadow:0 2px 5px #000,0 0 8px #000
}

#info{
 position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;
 background:rgba(0,0,0,.58);backdrop-filter:blur(7px)
}
#card{
 width:min(1100px,92vw);max-height:88vh;overflow:auto;
 display:grid;grid-template-columns:1.05fr 1fr;gap:28px;
 padding:28px;border:1px solid rgba(255,255,255,.18);border-radius:20px;
 background:linear-gradient(145deg,rgba(9,18,28,.97),rgba(2,8,15,.94));
 box-shadow:0 25px 90px rgba(0,0,0,.7)
}
#fishImage{
 width:100%;height:430px;object-fit:cover;border-radius:14px;
 background:#06111a
}
#card h1{font-size:36px;margin:8px 0 4px}
#latin{color:#8fa8ba;font-style:italic;margin-bottom:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stat{padding:12px;border-radius:9px;background:rgba(255,255,255,.06)}
.stat small{display:block;color:#8fa8ba;font-size:11px;margin-bottom:4px}
.stat b{font-size:15px}
#desc{line-height:1.8;color:#d8e2ea}
#close{
 position:absolute;right:28px;top:22px;width:38px;height:38px;border-radius:50%;
 border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);
 color:#fff;font-size:22px;cursor:pointer
}
@media(max-width:800px){
 #fishList{left:15px;right:15px;top:auto;bottom:15px;width:auto;display:flex;gap:5px;overflow:auto}
 #fishList h3{display:none}.fishBtn{min-width:150px}
 #card{grid-template-columns:1fr;padding:18px}
 #fishImage{height:260px}#card h1{font-size:28px}
}
#status{
 position:fixed;left:18px;bottom:18px;z-index:99999;
 padding:10px 14px;border:1px solid #334155;border-radius:10px;
 background:rgba(3,8,15,.9);color:#b8c7d9;font:13px/1.4 sans-serif;
 max-width:70vw;pointer-events:none
}
</style>
</head>

<body>
<div id="cesiumContainer"></div>
<div id="status">起動中…</div>

<div id="hud">
  <div class="title">🐠 TROPICAL FISH EARTH ATLAS</div>
  <div class="sub">3D地球を回転 → ピンをクリック → 生息地へ急降下</div>
</div>

<div id="fishList">
  <h3>HABITAT SELECT</h3>
  <div id="buttons"></div>
</div>

<div id="info">
  <button id="close">×</button>
  <div id="card">
    <img id="fishImage" alt="">
    <div>
      <h1 id="fishName"></h1>
      <div id="latin"></div>
      <div class="stats">
        <div class="stat"><small>HABITAT</small><b id="habitat"></b></div>
        <div class="stat"><small>WATER TEMP</small><b id="temp"></b></div>
        <div class="stat"><small>pH</small><b id="ph"></b></div>
        <div class="stat"><small>HARDNESS</small><b id="hardness"></b></div>
      </div>
      <div id="desc"></div>
    </div>
  </div>
</div>

<script>
window.addEventListener("error", function(e){
  const el = document.getElementById("status");
  if (el) {
    el.textContent = "JavaScriptエラー: " + (e.message || "unknown error");
    el.style.color = "#ff8080";
  }
  console.error(e.error || e.message);
});
</script>
<script>
Cesium.Ion.defaultAccessToken = "";

const fishData = [
 {
  name:"ネオンテトラ", latin:"Paracheirodon innesi",
  lat:-3.135,lng:-60.025,height:18000,
  habitat:"アマゾン川水系・ネグロ川",temp:"24–28℃",ph:"4.0–7.0",hardness:"軟水",
  image:"https://upload.wikimedia.org/wikipedia/commons/7/7e/Paracheirodon_innesi.jpg",
  desc:"アマゾン川流域のブラックウォーターに生息する小型カラシン。暗い水中で青と赤のラインが鮮やかに浮かび上がります。"
 },
 {
  name:"エンゼルフィッシュ",latin:"Pterophyllum scalare",
  lat:-2.430,lng:-55.000,height:18000,
  habitat:"タパジョス川水系",temp:"24–30℃",ph:"6.0–7.5",hardness:"軟水〜中硬水",
  image:"https://upload.wikimedia.org/wikipedia/commons/1/1e/Pterophyllum_scalare.jpg",
  desc:"南米の流れの緩やかな水域や水草の多い場所に生息。特徴的な体高のある体形を持つシクリッドです。"
 },
 {
  name:"フロントーサ",latin:"Cyphotilapia frontosa",
  lat:-4.880,lng:29.800,height:18000,
  habitat:"タンガニーカ湖",temp:"23–27℃",ph:"8.0–9.0",hardness:"硬水",
  image:"https://upload.wikimedia.org/wikipedia/commons/0/0e/Cyphotilapia_frontosa.jpg",
  desc:"アフリカ・タンガニーカ湖の深場を中心に暮らす大型シクリッド。額が大きく張り出す姿が特徴です。"
 },
 {
  name:"グッピー",latin:"Poecilia reticulata",
  lat:10.600,lng:-61.350,height:18000,
  habitat:"トリニダード島・カロニ川周辺",temp:"22–28℃",ph:"6.8–7.8",hardness:"軟水〜中硬水",
  image:"https://upload.wikimedia.org/wikipedia/commons/6/6f/Poecilia_reticulata.jpg",
  desc:"中南米原産の卵胎生メダカ類。流れの緩やかな小川や水路など、さまざまな淡水環境に適応しています。"
 },
 {
  name:"ベタ（原種スプレンデンス）",latin:"Betta splendens",
  lat:13.900,lng:100.450,height:18000,
  habitat:"タイ・チャオプラヤ川流域",temp:"24–30℃",ph:"6.0–8.0",hardness:"軟水〜中硬水",
  image:"https://upload.wikimedia.org/wikipedia/commons/3/3b/Betta_splendens.jpg",
  desc:"タイを中心とする東南アジアの浅い水域に生息。水田や湿地など、酸素の少ない環境にも適応しています。"
 }
];

// 外部の公開タイルを直接使います。
// ローカルのHTMLを file:// で開いても読み込める構成にしています。
function setStatus(message, isError = false){
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = message;
  el.style.color = isError ? "#ff8080" : "#b8c7d9";
}

let viewer;

try {
  setStatus("Cesium読み込み完了。地球を初期化中…");

  // まず地球そのものを確実に生成。
  // 画像タイルはViewer生成後に追加することで、
  // file:// 環境でもどこで止まったか分かるようにします。
  viewer = new Cesium.Viewer("cesiumContainer", {
    animation: false,
    timeline: false,
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    fullscreenButton: false,
    infoBox: false,
    selectionIndicator: false,
    fullscreenButton: false,
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    baseLayer: false,
    skyBox: false,
    skyAtmosphere: false
  });

  setStatus("地球の初期化OK。地図タイルを読み込み中…");

  const earthImagery = new Cesium.OpenStreetMapImageryProvider({
    url: "https://tile.openstreetmap.org/"
  });
  viewer.imageryLayers.add(new Cesium.ImageryLayer(earthImagery));

  setStatus("地図タイルOK。魚のピンを配置中…");
} catch (e) {
  console.error(e);
  setStatus("初期化エラー: " + (e && e.message ? e.message : e), true);
  throw e;
}

viewer.scene.globe.show = true;
viewer.scene.globe.enableLighting = true;
viewer.scene.globe.showGroundAtmosphere = true;
viewer.scene.backgroundColor = Cesium.Color.BLACK;

const pinEntities=[];

function makePin(f){
 const entity=viewer.entities.add({
  position:Cesium.Cartesian3.fromDegrees(f.lng,f.lat,100),
  name:f.name,
  billboard:{
   image:makePinCanvas(),
   width:34,height:34,
   verticalOrigin:Cesium.VerticalOrigin.CENTER,
   disableDepthTestDistance:Number.POSITIVE_INFINITY
  },
  label:{
   text:f.name,font:"bold 13px sans-serif",
   fillColor:Cesium.Color.WHITE,
   outlineColor:Cesium.Color.BLACK,outlineWidth:4,
   style:Cesium.LabelStyle.FILL_AND_OUTLINE,
   pixelOffset:new Cesium.Cartesian2(0,25),
   disableDepthTestDistance:Number.POSITIVE_INFINITY
  }
 });
 entity.fish=f;
 pinEntities.push(entity);
}

function makePinCanvas(){
 const c=document.createElement("canvas");c.width=64;c.height=64;
 const x=c.getContext("2d");
 const g=x.createRadialGradient(32,32,3,32,32,31);
 g.addColorStop(0,"white");g.addColorStop(.12,"#16c8ff");
 g.addColorStop(.35,"rgba(22,200,255,.8)");g.addColorStop(1,"rgba(22,200,255,0)");
 x.fillStyle=g;x.fillRect(0,0,64,64);
 x.beginPath();x.arc(32,32,8,0,Math.PI*2);x.fillStyle="#fff";x.fill();
 return c.toDataURL();
}

fishData.forEach(makePin);

const buttons=document.getElementById("buttons");
fishData.forEach(f=>{
 const b=document.createElement("button");
 b.className="fishBtn";b.textContent="📍 "+f.name;
 b.onclick=()=>flyToFish(f);
 buttons.appendChild(b);
});
setStatus("起動完了。地球をドラッグして回転できます。");

let flying=false;

function flyToFish(f){
 flying=true;
 document.getElementById("info").style.display="none";

 const destination=Cesium.Cartesian3.fromDegrees(f.lng,f.lat,f.height);

 viewer.camera.flyTo({
  destination,
  orientation:{
   heading:Cesium.Math.toRadians(0),
   pitch:Cesium.Math.toRadians(-55),
   roll:0
  },
  duration:4.5,
  complete:()=>{
   flying=false;
   setTimeout(()=>showFish(f),500);
  }
 });
}

function showFish(f){
 document.getElementById("fishName").textContent=f.name;
 document.getElementById("latin").textContent=f.latin;
 document.getElementById("habitat").textContent=f.habitat;
 document.getElementById("temp").textContent=f.temp;
 document.getElementById("ph").textContent=f.ph;
 document.getElementById("hardness").textContent=f.hardness;
 document.getElementById("desc").textContent=f.desc;
 document.getElementById("fishImage").src=f.image;
 document.getElementById("fishImage").alt=f.name;
 document.getElementById("info").style.display="flex";
}

viewer.screenSpaceEventHandler.setInputAction(function(click){
 const picked=viewer.scene.pick(click.position);
 if(Cesium.defined(picked) && picked.id && picked.id.fish){
  flyToFish(picked.id.fish);
 }
},Cesium.ScreenSpaceEventType.LEFT_CLICK);

document.getElementById("close").onclick=()=>document.getElementById("info").style.display="none";
document.getElementById("info").addEventListener("click",e=>{
 if(e.target.id==="info") e.currentTarget.style.display="none";
});

viewer.camera.setView({
 destination:Cesium.Cartesian3.fromDegrees(-45,0,17500000),
 orientation:{heading:0,pitch:Cesium.Math.toRadians(-90),roll:0}
});

window.addEventListener("error", (e) => {
  console.error("Cesium error:", e.error || e.message);
});
</script>
</body>
</html>
