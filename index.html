<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の熱帯魚 生息地3Dマップ（衛星画像版）</title>
  <!-- CesiumJS CDN -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    /* Cesium標準の不要なUIをスッキリさせる */
    .cesium-viewer-bottom {
      display: none !important;
    }

    /* ヘッダー */
    #header {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      color: #f8fafc;
    }
    #header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    #header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    /* 視点リセットボタン */
    #reset-btn {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    #reset-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: #38bdf8;
    }

    /* 詳細情報サイドパネル */
    #info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 350px;
      max-height: calc(100vh - 40px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 20;
      color: #e2e8f0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
      transform: translateX(420px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #info-panel.active {
      transform: translateX(0);
    }

    #close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    #close-btn:hover {
      color: #ffffff;
    }

    .fish-image {
      width: 100%;
      height: 195px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
      background-color: #1e293b;
    }

    .fish-name {
      margin: 14px 0 2px;
      font-size: 1.3rem;
      color: #38bdf8;
    }

    .scientific-name {
      margin: 0 0 14px;
      font-size: 0.85rem;
      font-style: italic;
      color: #94a3b8;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #7dd3fc;
      letter-spacing: 0.05em;
      margin: 14px 0 6px;
      border-bottom: 1px solid rgba(125, 211, 252, 0.25);
      padding-bottom: 3px;
    }

    .description-text {
      font-size: 0.9rem;
      line-height: 1.65;
      margin: 0;
    }

    .water-params {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .param-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 6px;
      padding: 8px 6px;
      text-align: center;
    }

    .param-label {
      display: block;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .param-value {
      display: block;
      font-size: 0.92rem;
      font-weight: bold;
      color: #f8fafc;
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      #info-panel {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        max-height: 60vh;
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
      }
      #info-panel.active {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>Tropical Fish Habitat 3D</h1>
    <p>衛星マップ上のピンをクリックすると現地の河川・生息域へズームします</p>
  </div>

  <button id="reset-btn">🌍 全体表示に戻る</button>

  <div id="cesiumContainer"></div>

  <!-- 詳細情報パネル -->
  <div id="info-panel">
    <button id="close-btn" title="閉じる">&times;</button>
    <img id="panel-img" class="fish-image" src="" alt="熱帯魚の画像">
    <h2 id="panel-name" class="fish-name"></h2>
    <p id="panel-sci" class="scientific-name"></p>

    <div class="section-title">生息地・環境</div>
    <p id="panel-habitat" class="description-text"></p>

    <div class="section-title">現地の水質目安</div>
    <div class="water-params">
      <div class="param-box">
        <span class="param-label">水温</span>
        <span id="panel-temp" class="param-value"></span>
      </div>
      <div class="param-box">
        <span class="param-label">pH</span>
        <span id="panel-ph" class="param-value"></span>
      </div>
      <div class="param-box">
        <span class="param-label">硬度</span>
        <span id="panel-hardness" class="param-value"></span>
      </div>
    </div>
    <p id="panel-water-desc" class="description-text" style="margin-top: 8px;"></p>
  </div>

  <script>
    // 1. 熱帯魚データ（河川のすぐ近くに座標を設定するとズーム時に川筋が見えます）
    const fishHabitats = [
      {
        id: 'neon-tetra',
        name: 'ネオンテトラ',
        scientificName: 'Paracheirodon innesi',
        lat: -3.4653,
        lng: -62.2159,
        pinColor: '#38bdf8',
        image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Paracheirodon_innesi_1.jpg/640px-Paracheirodon_innesi_1.jpg',
        habitat: '南米アマゾン川上流域（ペルー、コロンビア、ブラジル国境付近の支流）。鬱蒼とした熱帯雨林に覆われ、直射日光が遮られた流れの緩やかな小川やブラックウォーター環境に生息します。',
        temp: '22〜26℃',
        ph: '5.0〜6.5',
        hardness: '軟水 (1〜4 dGH)',
        waterDesc: '落ち葉や流木から溶け出したタンニン（フミン酸）を豊富に含む、紅茶色の弱酸性・超軟水環境です。'
      },
      {
        id: 'cardinal-tetra',
        name: 'カージナルテトラ',
        scientificName: 'Paracheirodon axelrodi',
        lat: -0.4167,
        lng: -64.8333,
        pinColor: '#f43f5e',
        image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Paracheirodon_axelrodi_-_Cardinal_tetra.jpg/640px-Paracheirodon_axelrodi_-_Cardinal_tetra.jpg',
        habitat: 'ブラジル・ネグロ川中〜上流域（サンタ・イザベル周辺）およびオリノコ川水系。赤道直下の高温域の細流や浸水林（イガポー）に大群で生息しています。',
        temp: '24〜28℃',
        ph: '4.5〜6.0',
        hardness: '超軟水 (1〜2 dGH)',
        waterDesc: 'ミネラル分が極めて少ないブラックウォーター。水温が高めで強い酸性を示す傾向があります。'
      },
      {
        id: 'harlequin-rasbora',
        name: 'ラスボラ・エスペイ',
        scientificName: 'Trigonostigma espei',
        lat: 12.2484,
        lng: 102.5152,
        pinColor: '#fb923c',
        image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Trigonostigma_espei.jpg/640px-Trigonostigma_espei.jpg',
        habitat: 'タイ南東部（トラート県周辺）〜カンボジアの森林地帯にある小川や湿地帯。水草や岸辺の植物が水面まで覆いかぶさるような穏やかな水域を好みます。',
        temp: '23〜27℃',
        ph: '5.5〜6.8',
        hardness: '軟水 (2〜6 dGH)',
        waterDesc: '腐植質を含んだ弱酸性の軟水。クリアウォーターとブラックウォーターの中間的な水質が多い地域です。'
      },
      {
        id: 'rummy-nose-tetra',
        name: 'ラミーノーズテトラ',
        scientificName: 'Hemigrammus rhodostomus',
        lat: -1.8558,
        lng: -52.2302,
        pinColor: '#ef4444',
        image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Hemigrammus_bleheri.jpg/640px-Hemigrammus_bleheri.jpg',
        habitat: 'ブラジル・アマゾン川下流域（シングー川合流部周辺）およびオリノコ川水系。水質変化に敏感で、溶存酸素量の多い清浄な支流に生息します。',
        temp: '24〜27℃',
        ph: '5.5〜6.8',
        hardness: '軟水 (2〜5 dGH)',
        waterDesc: '透明度が高いクリアウォーター〜弱ブラックウォーター。有機物汚染が少なく安定した弱酸性を好みます。'
      }
    ];

    // 2. Cesium Viewerの初期化（高精細衛星画像レイヤーを使用）
    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        Cesium.ArcGisMapServerImageryProvider.fromUrl(
          'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
        )
      ),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false
    });

    // 宇宙空間の星・大気表現を強調
    viewer.scene.globe.enableLighting = false;

    // 3. ピンアイコンをCanvasで動的生成（Google Earth風の立体ピン）
    function createPinCanvas(color) {
      const canvas = document.createElement('canvas');
      canvas.width = 48;
      canvas.height = 60;
      const ctx = canvas.getContext('2d');

      // ピンの影
      ctx.beginPath();
      ctx.ellipse(24, 55, 8, 3, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fill();

      // ピン本体
      ctx.beginPath();
      ctx.moveTo(24, 54);
      ctx.bezierCurveTo(24, 54, 6, 33, 6, 20);
      ctx.arc(24, 20, 18, Math.PI, 0, false);
      ctx.bezierCurveTo(42, 33, 24, 54, 24, 54);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // 中央の白い丸
      ctx.beginPath();
      ctx.arc(24, 20, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      return canvas;
    }

    // 4. 地球儀上にピンとラベルを配置
    fishHabitats.forEach(fish => {
      viewer.entities.add({
        id: fish.id,
        position: Cesium.Cartesian3.fromDegrees(fish.lng, fish.lat),
        billboard: {
          image: createPinCanvas(fish.pinColor),
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          scale: 0.85,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        label: {
          text: fish.name,
          font: 'bold 13px "Hiragino Sans", "Meiryo", sans-serif',
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.TOP,
          pixelOffset: new Cesium.Cartesian2(0, 6),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        fishData: fish
      });
    });

    // 初期カメラ位置（南米〜大西洋上空）
    function flyToOverview() {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-45.0, -5.0, 16000000),
        duration: 1.5
      });
    }
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(-45.0, -5.0, 16000000)
    });

    // 5. ピンクリック時のズーム＆パネル表示処理
    const infoPanel = document.getElementById('info-panel');
    const closeBtn = document.getElementById('close-btn');
    const resetBtn = document.getElementById('reset-btn');

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (click) {
      const pickedObject = viewer.scene.pick(click.position);
      if (Cesium.defined(pickedObject) && pickedObject.id && pickedObject.id.fishData) {
        selectFish(pickedObject.id.fishData);
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // ホバー時にカーソルをポインターに変更
    handler.setInputAction(function (movement) {
      const pickedObject = viewer.scene.pick(movement.endPosition);
      if (Cesium.defined(pickedObject) && pickedObject.id && pickedObject.id.fishData) {
        viewer.container.style.cursor = 'pointer';
      } else {
        viewer.container.style.cursor = 'default';
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    function selectFish(fish) {
      // Google Earth風に斜め上空から現地の河川へダイブするようにズームイン
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(fish.lng, fish.lat - 0.15, 25000), // 高度25kmまで接近
        orientation: {
          heading: Cesium.Math.toRadians(0.0),
          pitch: Cesium.Math.toRadians(-55.0), // 斜め見下ろし角度
          roll: 0.0
        },
        duration: 2.0
      });

      // パネル内容を更新
      document.getElementById('panel-img').src = fish.image;
      document.getElementById('panel-name').textContent = fish.name;
      document.getElementById('panel-sci').textContent = fish.scientificName;
      document.getElementById('panel-habitat').textContent = fish.habitat;
      document.getElementById('panel-temp').textContent = fish.temp;
      document.getElementById('panel-ph').textContent = fish.ph;
      document.getElementById('panel-hardness').textContent = fish.hardness;
      document.getElementById('panel-water-desc').textContent = fish.waterDesc;

      infoPanel.classList.add('active');
    }

    closeBtn.addEventListener('click', () => {
      infoPanel.classList.remove('active');
    });

    resetBtn.addEventListener('click', () => {
      infoPanel.classList.remove('active');
      flyToOverview();
    });
  </script>
</body>
</html>
