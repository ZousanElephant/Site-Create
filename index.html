<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の熱帯魚 生息地3Dマップ</title>
  <!-- CesiumJS CDN -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    .cesium-viewer-bottom {
      display: none !important;
    }

    #header {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      color: #f8fafc;
    }
    #header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    #header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    #reset-btn {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    #reset-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: #38bdf8;
    }

    #info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 350px;
      max-height: calc(100vh - 40px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 20;
      color: #e2e8f0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
      transform: translateX(420px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #info-panel.active {
      transform: translateX(0);
    }

    #close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    #close-btn:hover {
      color: #ffffff;
    }

    .fish-image {
      width: 100%;
      height: 195px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
      background-color: #1e293b;
    }

    .fish-name {
      margin: 14px 0 2px;
      font-size: 1.3rem;
      color: #38bdf8;
    }

    .scientific-name {
      margin: 0 0 14px;
      font-size: 0.85rem;
      font-style: italic;
      color: #94a3b8;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #7dd3fc;
      letter-spacing: 0.05em;
      margin: 14px 0 6px;
      border-bottom: 1px solid rgba(125, 211, 252, 0.25);
      padding-bottom: 3px;
    }

    .description-text {
      font-size: 0.9rem;
      line-height: 1.65;
      margin: 0;
    }

    .water-params {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .param-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 6px;
      padding: 8px 6px;
      text-align: center;
    }

    .param-label {
      display: block;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .param-value {
      display: block;
      font-size: 0.92rem;
      font-weight: bold;
      color: #f8fafc;
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      #info-panel {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        max-height: 60vh;
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
      }
      #info-panel.active {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>Tropical Fish Habitat 3D</h1>
    <p>衛星マップ上のピンをクリックすると現地の河川・生息域へズームします</p>
  </div>

  <button id="reset-btn">🌍 全体表示に戻る</button>

  <div id="cesiumContainer"></div>

  <!-- 詳細情報パネル -->
  <div id="info-panel">
    <button id="close-btn" title="閉じる">&times;</button>
    <img id="panel-img" class="fish-image" src="" alt="熱帯魚の画像">
    <h2 id="panel-name" class="fish-name"></h2>
    <p id="panel-sci" class="scientific-name"></p>

    <div class="section-title">生息地・環境</div>
    <p id="panel-habitat" class="description-text"></p>

    <div class="section-title">現地の水質目安</div>
    <div class="water-params">
      <div class="param-box">
        <span class="param-label">水温</span>
        <span id="panel-temp" class="param-value"></span>
      </div>
      <div class="param-box">
        <span class="param-label">pH</span>
        <span id="panel-ph" class="param-value"></span>
      </div>
      <div class="param-box">
        <span class="param-label">硬度</span>
        <span id="panel-hardness" class="param-value"></span>
      </div>
    </div>
    <p id="panel-water-desc" class="description-text" style="margin-top: 8px;"></p>
  </div>

  <!-- 制御ロジックの読み込み -->
  <script src="./app.js"></script>
</body>
</html>
